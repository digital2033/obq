# Builds the app and publishes it with GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Source = "GitHub Actions".
# Optional: add a repository secret FIREBASE_CONFIG_JSON (Settings > Secrets and variables > Actions) holding your Firebase web
# config as JSON, to turn on sign-in with Firebase on the published site. Without it the site runs in local mode with the sample bank.
name: Build and deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl pillow
      - name: Firebase config from the secret (optional)
        env: { FB: "${{ secrets.FIREBASE_CONFIG_JSON }}" }
        run: |
          if [ -n "$FB" ]; then mkdir -p private && printf '%s' "$FB" > private/firebase.config.json; echo "Firebase config applied"; else echo "No Firebase secret: local mode"; fi
      - run: python tools/make_template.py && python tools/assemble.py && python tools/build_pwa.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/obq-app }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
