# Builds the app and publishes it with GitHub Pages on every push to main. The very basic version is published at /basic/ next to the full app.
# One-time setup: Settings > Pages > Source = "GitHub Actions".
# Optional secrets: OBQ_BANK_KEY (the key that decrypts the full question bank, src/cfg3_bank.enc.json; without it the small sample bank is used)
# SITE_CONFIG_JSON (the operator name and contact email shown in the Terms and Conditions) and FIREBASE_CONFIG_JSON (Settings > Secrets and variables > Actions) holding your Firebase web
# config as JSON, to turn on sign-in with Firebase on the published site. Without it the site runs in local mode.
name: Build and deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl pillow
      - name: Firebase config from the secret (optional)
        env: { FB: "${{ secrets.FIREBASE_CONFIG_JSON }}" }
        run: |
          if [ -n "$FB" ]; then mkdir -p private && printf '%s' "$FB" > private/firebase.config.json; echo "Firebase config applied"; else echo "No Firebase secret: local mode"; fi
      # Optional secret SITE_CONFIG_JSON holds the operator name and contact email shown in the Terms, as JSON with the keys operatorName and contactEmail
      - name: Site details for the Terms (optional)
        env: { SITE: "${{ secrets.SITE_CONFIG_JSON }}" }
        run: |
          if [ -n "$SITE" ]; then mkdir -p private && printf '%s' "$SITE" > private/site.config.json; fi
      - run: pip install cryptography
      - name: Build
        env: { OBQ_BANK_KEY: "${{ secrets.OBQ_BANK_KEY }}" }
        run: |
          python tools/make_template.py
          python tools/assemble.py
          python tools/assemble.py --basic
          python tools/build_pwa.py
          mkdir -p dist/obq-app/basic && cp dist/obq-basic.html dist/obq-app/basic/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/obq-app }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
